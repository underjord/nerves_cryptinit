# 64-byte key (AES-256-XTS, aes-xts-plain64). Must match the bytes in
# key.bin. fwup only supports AES-256-XTS for offline rootfs encryption,
# so the key is 64 bytes / 128 hex chars. XTS requires the two 32-byte
# halves to differ — the first is 0x00..0x1f, the second its byte-reverse.
rootfs_key = hex:000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f1f1e1d1c1b1a191817161514131211100f0e0d0c0b0a09080706050403020100
