# Pi 5 / Pi 4 with a key derived from customer OTP.
# /usr/sbin/unlock reads /dev/vcio at boot time and prints 64 hex chars.

rootfs_key = cmd:/usr/sbin/unlock

# dm-verity is mandatory — see ../verity-rootfs/. The hash tree sits on the
# decrypted rootfs device right after the filesystem; init derives its
# offset from the filesystem size, so nothing about verity goes here. The
# root hash rides the signed boot.img cmdline as verity_roothash=.
