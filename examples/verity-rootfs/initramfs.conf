# Integrity-verified (read-only) rootfs via dm-verity. Verity is mandatory
# in nerves_cryptinit; this is the minimal case (just verity, no dm-crypt).
#
# There is nothing to configure here. In fact this file is entirely
# optional for a verity-only boot — you can ship no /etc/initramfs.conf at
# all and init still verifies the rootfs. It's kept as an empty stub for
# illustration.
#
# Why nothing is needed:
#
#   - The trust anchor is the root hash, and it rides the *signed* kernel
#     cmdline as `verity_roothash=<hex>` — deliberately NOT in the CPIO. A
#     root hash an attacker can edit buys you nothing, so it has to live
#     wherever your secure-boot chain signs (cmdline / boot.img).
#
#   - Everything else the dm-verity target needs — hash algorithm, salt,
#     data and hash block sizes, data-block count — is read at boot from the
#     verity superblock that `veritysetup format` wrote.
#
#   - The hash tree's location is *derived*: it's appended to the rootfs
#     device right after the filesystem at a 4096-byte boundary, so init
#     reads the filesystem size out of the squashfs/EROFS/ext4 superblock
#     and rounds up to find it. (Previously this was the verity_hash_offset
#     knob; it's now computed.)
#
# Co-location is deliberate: when you add dm-crypt (see ../plaintext-key/,
# ../pi5-otp/) the hash tree lives inside the encrypted device and so is
# encrypted too — and init derives the offset from the *decrypted* view.
