# The bootstrap-or-derive helper handles both first-boot conversion AND
# normal-boot key derivation. nerves_cryptinit doesn't need to know
# which path is being taken — it just sees a (potentially slow) cmd:
# helper that returns a key.

rootfs_key = cmd:/usr/sbin/bootstrap-or-derive

# dm-verity is mandatory — see ../verity-rootfs/. init derives the hash-tree
# offset from the filesystem size, so there's nothing to configure here.
# Note for bootstrap: the first-boot conversion must write the verity hash
# tree right after the filesystem (4096-aligned) on the destination and
# arrange for the matching verity_roothash= to reach the signed cmdline, or
# the converted rootfs won't verify on the next boot.
