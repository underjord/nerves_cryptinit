version = 1
SPDX-PackageName = "nerves_cryptinit"
SPDX-PackageSupplier = "Frank Hunleth <fhunleth@troodon-software.com>"
SPDX-PackageDownloadLocation = "https://github.com/underjord/nerves_cryptinit"

# Source files carry their own headers. This covers the rest: docs, examples,
# build files and test data.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Frank Hunleth"
